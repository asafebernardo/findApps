[package]
name = "findapps"
version = "0.1.0"
edition = "2021"
description = "Gerenciador universal de aplicativos Linux"
authors = ["FindApps Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/asafebernardo/findApps"
readme = "README.md"
keywords = ["linux", "package-manager", "gtk", "flatpak", "apt"]
categories = ["gui"]

[lib]
name = "findapps"
path = "src/lib.rs"

[[bin]]
name = "findapps"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
async-trait = "0.1"
async-channel = "2"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

dirs = "5"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
